<svg xmlns="http://www.w3.org/2000/svg" width="920" height="990" viewBox="0 0 920 990">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="920" height="990" fill="#FFFFFF"/>
<text x="460" y="42.4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F3A5F" text-anchor="middle">Store Setup &amp; Daily Admin Routine</text>
<line x1="40" y1="58" x2="880" y2="58" stroke="#E2E8F0" stroke-width="2"/>
<text x="240" y="96.65" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F5D8A" text-anchor="middle">A. One-time store setup</text><text x="680" y="96.65" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#2E7D32" text-anchor="middle">B. Daily admin routine</text><rect x="60" y="107" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="134.89999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">1. Dropdown Masters &amp; Attributes</text><text x="240" y="156.99999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">(sizes, flavours, status labels)</text><rect x="60" y="205" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="243.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">2. Categories</text><rect x="60" y="303" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="330.9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">3. Products</text><text x="240" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">(variants, prices, images)</text><rect x="60" y="401" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="428.9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">4. Stock &amp; Inventory</text><text x="240" y="451" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">(opening stock, low-stock alert)</text><rect x="60" y="499" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="537.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">5. Combos &amp; Gift Hampers</text><rect x="60" y="597" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="635.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">6. Homepage Banners &amp; FAQs</text><rect x="60" y="695" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="722.9000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">7. Store Settings &amp; Delivery Pincodes</text><text x="240" y="745.0000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">(shipping, GST, contact)</text><rect x="60" y="793" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="240" y="831.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">8. Coupons &amp; Reward Coins</text><rect x="500" y="107" width="360" height="66" rx="10" fill="#E7F5EC" stroke="#2E7D32" stroke-width="2"/><text x="680" y="134.89999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">1. Open Dashboard</text><text x="680" y="156.99999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">(new orders, revenue, stock alerts)</text><rect x="500" y="205" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="680" y="232.89999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">2. Order Management:</text><text x="680" y="254.99999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">confirm, pack &amp; ship new orders</text><rect x="500" y="303" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="680" y="330.9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">3. Add courier + tracking number</text><text x="680" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">when shipping</text><rect x="500" y="401" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="680" y="428.9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">4. Mark Delivered / handle</text><text x="680" y="451" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">cancellations &amp; returns</text><rect x="500" y="499" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="680" y="526.9000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">5. Stock &amp; Inventory:</text><text x="680" y="549.0000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">restock low / out-of-stock items</text><rect x="500" y="597" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="680" y="635.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">6. Reply to Contact Inquiries</text><rect x="500" y="695" width="360" height="66" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="680" y="733.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">7. Approve or reject Customer Reviews</text><path d="M240,173 L240,205" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,205 234,193 246,193" fill="#475569"/><path d="M240,271 L240,303" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,303 234,291 246,291" fill="#475569"/><path d="M240,369 L240,401" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,401 234,389 246,389" fill="#475569"/><path d="M240,467 L240,499" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,499 234,487 246,487" fill="#475569"/><path d="M240,565 L240,597" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,597 234,585 246,585" fill="#475569"/><path d="M240,663 L240,695" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,695 234,683 246,683" fill="#475569"/><path d="M240,761 L240,793" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,793 234,781 246,781" fill="#475569"/><path d="M680,173 L680,205" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,205 674,193 686,193" fill="#475569"/><path d="M680,271 L680,303" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,303 674,291 686,291" fill="#475569"/><path d="M680,369 L680,401" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,401 674,389 686,389" fill="#475569"/><path d="M680,467 L680,499" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,499 674,487 686,487" fill="#475569"/><path d="M680,565 L680,597" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,597 674,585 686,585" fill="#475569"/><path d="M680,663 L680,695" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,695 674,683 686,683" fill="#475569"/><rect x="90" y="904" width="300" height="52" rx="26" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="240" y="935.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Store is live</text><path d="M240,859 L240,904" fill="none" stroke="#475569" stroke-width="2"/><polygon points="240,904 234,892 246,892" fill="#475569"/><rect x="530" y="904" width="300" height="52" rx="26" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="680" y="935.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Repeat every day</text><path d="M680,761 L680,904" fill="none" stroke="#475569" stroke-width="2"/><polygon points="680,904 674,892 686,892" fill="#475569"/><line x1="460" y1="75" x2="460" y2="960" stroke="#E2E8F0" stroke-width="2"/>

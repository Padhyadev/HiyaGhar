<svg xmlns="http://www.w3.org/2000/svg" width="920" height="996" viewBox="0 0 920 996">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="920" height="996" fill="#FFFFFF"/>
<text x="460" y="42.4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F3A5F" text-anchor="middle">Order Lifecycle (Order Management)</text>
<line x1="40" y1="58" x2="880" y2="58" stroke="#E2E8F0" stroke-width="2"/>
<rect x="120" y="84" width="260" height="52" rx="26" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="250" y="115.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Placed</text><rect x="120" y="176" width="260" height="52" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="250" y="207.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Confirmed</text><rect x="120" y="268" width="260" height="52" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="250" y="299.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Processing</text><rect x="120" y="360" width="260" height="52" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="250" y="391.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Packed</text><rect x="120" y="452" width="260" height="52" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="250" y="483.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Shipped</text><rect x="120" y="544" width="260" height="52" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="250" y="575.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Out for Delivery</text><rect x="120" y="636" width="260" height="52" rx="10" fill="#E7F5EC" stroke="#2E7D32" stroke-width="2"/><text x="250" y="667.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Delivered</text><rect x="120" y="728" width="260" height="52" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="250" y="759.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Returned</text><path d="M250,136 L250,176" fill="none" stroke="#475569" stroke-width="2"/><polygon points="250,176 244,164 256,164" fill="#475569"/><path d="M250,228 L250,268" fill="none" stroke="#475569" stroke-width="2"/><polygon points="250,268 244,256 256,256" fill="#475569"/><path d="M250,320 L250,360" fill="none" stroke="#475569" stroke-width="2"/><polygon points="250,360 244,348 256,348" fill="#475569"/><path d="M250,412 L250,452" fill="none" stroke="#475569" stroke-width="2"/><polygon points="250,452 244,440 256,440" fill="#475569"/><path d="M250,504 L250,544" fill="none" stroke="#475569" stroke-width="2"/><polygon points="250,544 244,532 256,532" fill="#475569"/><path d="M250,596 L250,636" fill="none" stroke="#475569" stroke-width="2"/><polygon points="250,636 244,624 256,624" fill="#475569"/><path d="M250,688 L250,728" fill="none" stroke="#475569" stroke-width="2"/><polygon points="250,728 244,716 256,716" fill="#475569"/><rect x="179.25" y="696" width="141.5" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="250" y="712.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">Return (reason)</text><line x1="380" y1="110" x2="450" y2="110" stroke="#C0392B" stroke-width="2"/><line x1="380" y1="202" x2="450" y2="202" stroke="#C0392B" stroke-width="2"/><line x1="380" y1="294" x2="450" y2="294" stroke="#C0392B" stroke-width="2"/><line x1="380" y1="386" x2="450" y2="386" stroke="#C0392B" stroke-width="2"/><line x1="450" y1="110" x2="450" y2="386" stroke="#C0392B" stroke-width="2"/><path d="M450,248 L575,248" fill="none" stroke="#C0392B" stroke-width="2"/><polygon points="575,248 563,254 563,242" fill="#C0392B"/><text x="512.5" y="236.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#C0392B" text-anchor="middle">Cancel (reason)</text><rect x="575" y="222" width="230" height="52" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="690" y="253.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Cancelled</text><path d="M690,274 L690,297" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><rect x="565" y="297" width="250" height="66" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="690" y="325.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Items returned to stock</text><text x="690" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Reward coins reversed</text><path d="M380,478 L565,478" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><rect x="565" y="445" width="250" height="66" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="690" y="473.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Courier name and</text><text x="690" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Tracking / AWB no. required</text><path d="M380,662 L565,662" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><rect x="565" y="629" width="250" height="66" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="690" y="657.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Reward coins credited</text><text x="690" y="677" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">to the customer</text><path d="M380,754 L565,754" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><rect x="565" y="721" width="250" height="66" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="690" y="749.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Items returned to stock</text><text x="690" y="769" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Reward coins reversed</text><text x="60" y="842.6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3A5F" text-anchor="start">Payment status (updated separately by admin):</text><rect x="65" y="856" width="190" height="46" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="160" y="884.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Pending</text><rect x="345" y="856" width="190" height="46" rx="10" fill="#E7F5EC" stroke="#2E7D32" stroke-width="2"/><text x="440" y="884.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Paid</text><rect x="625" y="856" width="190" height="46" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="720" y="884.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Refunded</text><path d="M255,879 L345,879" fill="none" stroke="#475569" stroke-width="2"/><polygon points="345,879 333,885 333,873" fill="#475569"/><path d="M535,879 L625,879" fill="none" stroke="#475569" stroke-width="2"/><polygon points="625,879 613,885 613,873" fill="#475569"/><text x="60" y="946.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Admin may move an order forward and skip steps (e.g. Placed → Shipped), but never backwards.</text><text x="60" y="970.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Cancel is allowed only up to "Packed". Return is allowed only after "Delivered".</text>
</svg>
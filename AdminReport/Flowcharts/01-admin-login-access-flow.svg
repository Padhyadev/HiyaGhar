<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1290" viewBox="0 0 980 1290">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="980" height="1290" fill="#FFFFFF"/>
<text x="490" y="42.4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F3A5F" text-anchor="middle">Admin Login &amp; Access Control Flow</text>
<line x1="40" y1="58" x2="940" y2="58" stroke="#E2E8F0" stroke-width="2"/>
<rect x="250" y="83" width="300" height="54" rx="27" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="400" y="115.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Admin opens /admin</text><polygon points="400,170 550,230 400,290 250,230" fill="#FFF4D6" stroke="#C9962B" stroke-width="2"/><text x="400" y="224.89999999999998" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Already</text><text x="400" y="246.99999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">logged in?</text><rect x="620" y="184" width="250" height="92" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="745" y="213.85" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">Admin Login page</text><text x="745" y="235.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Email + Password</text><text x="745" y="258.05" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">(Remember me option)</text><polygon points="745,325 865,385 745,445 625,385" fill="#FFF4D6" stroke="#C9962B" stroke-width="2"/><text x="745" y="379.9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Credentials</text><text x="745" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">valid?</text><rect x="620" y="500" width="250" height="60" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="745" y="535.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Show error message</text><rect x="250" y="348" width="300" height="74" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="400" y="379.9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Save login token</text><text x="400" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Load roles &amp; permissions</text><rect x="250" y="459" width="300" height="92" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="400" y="488.84999999999997" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E293B" text-anchor="middle">Dashboard</text><text x="400" y="510.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Orders, revenue, stock alerts,</text><text x="400" y="533.05" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">sales chart</text><rect x="250" y="588" width="300" height="74" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="400" y="619.9000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Sidebar shows only the</text><text x="400" y="642.0000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">modules this role may view</text><rect x="250" y="703" width="300" height="54" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="400" y="735.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Admin selects a module</text><polygon points="400,795 550,860 400,925 250,860" fill="#FFF4D6" stroke="#C9962B" stroke-width="2"/><text x="400" y="854.9000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Role has</text><text x="400" y="877.0000000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">"View" permission?</text><rect x="20" y="814" width="190" height="92" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="115" y="843.85" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Access Denied</text><text x="115" y="865.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">page → back to</text><text x="115" y="888.0500000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Dashboard</text><rect x="250" y="973" width="300" height="54" rx="10" fill="#E7F5EC" stroke="#2E7D32" stroke-width="2"/><text x="400" y="1005.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Module page opens</text><rect x="230" y="1059" width="340" height="92" rx="10" fill="#EAF1FB" stroke="#2F5D8A" stroke-width="2"/><text x="400" y="1088.8500000000001" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">Add / Edit / Delete / Export</text><text x="400" y="1110.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">buttons appear only if the</text><text x="400" y="1133.0500000000002" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#1E293B" text-anchor="middle">role allows each action</text><rect x="250" y="1198" width="300" height="54" rx="27" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="400" y="1230.95" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Logout → Login page</text><path d="M400,137 L400,170" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,170 394,158 406,158" fill="#475569"/><path d="M550,230 L620,230" fill="none" stroke="#475569" stroke-width="2"/><polygon points="620,230 608,236 608,224" fill="#475569"/><rect x="569.5" y="218" width="31" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="585" y="234.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">No</text><path d="M400,290 L400,348" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,348 394,336 406,336" fill="#475569"/><rect x="380.25" y="296" width="39.5" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="400" y="312.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">Yes</text><path d="M745,276 L745,325" fill="none" stroke="#475569" stroke-width="2"/><polygon points="745,325 739,313 751,313" fill="#475569"/><path d="M625,385 L550,385" fill="none" stroke="#475569" stroke-width="2"/><polygon points="550,385 562,379 562,391" fill="#475569"/><rect x="567.75" y="373" width="39.5" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="587.5" y="389.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">Yes</text><path d="M745,445 L745,500" fill="none" stroke="#475569" stroke-width="2"/><polygon points="745,500 739,488 751,488" fill="#475569"/><rect x="729.5" y="453" width="31" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="745" y="469.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">No</text><path d="M870,530 L895,530 L895,230 L870,230" fill="none" stroke="#475569" stroke-width="2"/><polygon points="870,230 882,224 882,236" fill="#475569"/><rect x="849.75" y="453" width="90.5" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="895" y="469.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">Try again</text><path d="M400,422 L400,459" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,459 394,447 406,447" fill="#475569"/><path d="M400,551 L400,588" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,588 394,576 406,576" fill="#475569"/><path d="M400,662 L400,703" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,703 394,691 406,691" fill="#475569"/><path d="M400,757 L400,795" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,795 394,783 406,783" fill="#475569"/><path d="M250,860 L210,860" fill="none" stroke="#475569" stroke-width="2"/><polygon points="210,860 222,854 222,866" fill="#475569"/><rect x="214.5" y="848" width="31" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="230" y="864.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">No</text><path d="M400,925 L400,973" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,973 394,961 406,961" fill="#475569"/><rect x="380.25" y="933" width="39.5" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="400" y="949.9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B" text-anchor="middle">Yes</text><path d="M400,1027 L400,1059" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,1059 394,1047 406,1047" fill="#475569"/><path d="M400,1151 L400,1198" fill="none" stroke="#475569" stroke-width="2"/><polygon points="400,1198 394,1186 406,1186" fill="#475569"/><rect x="620" y="590" width="250" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/><text x="745" y="611.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E293B" text-anchor="middle">Super Admin</text><text x="745" y="630.75" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">sees every module and</text><text x="745" y="650.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">action. Other roles get</text><text x="745" y="669.75" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">only what is ticked in</text><text x="745" y="689.25" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#1E293B" text-anchor="middle">Roles &amp; Permissions.</text><path d="M620,645 L550,645" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>

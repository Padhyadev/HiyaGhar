<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>OTP Verification</title>
    <style>
        .container {
            width: 100%;
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f2ea;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: #fff;
            border-radius: 8px;
            padding: 25px;
            border: 1px solid #e6ddc9;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .otp {
            font-size: 32px;
            font-weight: bold;
            color: #2d6a4f;
            text-align: center;
            margin: 30px 0;
            letter-spacing: 5px;
        }

        .footer {
            color: #777;
            font-size: 13px;
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center;margin-bottom:20px;">
            <img src="cid:CompanyLogo" alt="Hiya" style="max-width:160px;height:auto;" />
        </div>

        <div class="box">
            <div class="title">Your Password Reset OTP</div>

            <p>Hello,</p>
            <p>Your One-Time Password (OTP) to reset your Hiya account password is:</p>

            <div class="otp">{{otp}}</div>

            <p>This OTP is valid for the next 10 minutes.</p>
            <p>If you did not request this, please ignore this email - your password will remain unchanged.</p>
        </div>
    </div>
</body>
</html>
